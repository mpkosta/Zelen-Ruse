<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Зелен Русе — 3D карта на сянката</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{--line:#2a3247;--text:#ede9e0;--dim:#9aa0b0;--accent:#f5b971;--hot:#ff4d2e;--green:#3ddc84}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#0a0e1a;color:var(--text)}
  #scene{position:fixed;inset:0;touch-action:none} canvas{display:block;touch-action:none}
  #hdr{position:fixed;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:30}
  #hdr .t h1{font-family:Georgia,serif;font-weight:400;font-size:22px;letter-spacing:2px;text-shadow:0 1px 8px rgba(0,0,0,.55)}
  #hdr .t h1 span{color:var(--green)}
  #hdr .t p{font-size:12px;color:#2f2b22;font-weight:600;text-shadow:0 1px 3px rgba(255,255,255,.45);margin-top:2px}
  #ctl{display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto}
  .row,#actRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .btn{background:rgba(15,20,31,.88);border:1px solid var(--line);color:var(--dim);font-size:12px;padding:8px 11px;border-radius:10px;cursor:pointer;backdrop-filter:blur(6px);transition:.15s}
  .btn:hover{color:var(--text)} .btn.on{border-color:var(--accent);color:var(--accent)}
  .btn.on.g{border-color:var(--green);color:var(--green)} .btn.on.h{border-color:var(--hot);color:var(--hot)}
  #langBtn{font-weight:700;letter-spacing:1px}
  #sunWrap{background:rgba(15,20,31,.88);border:1px solid var(--line);border-radius:10px;padding:7px 11px;display:flex;align-items:center;gap:9px;backdrop-filter:blur(6px)}
  #sunWrap label{font-size:11px;color:var(--dim);white-space:nowrap}
  #sunWrap>*{flex:none}
  #sunVal{font-size:12px;color:var(--accent);width:44px;text-align:right;font-variant-numeric:tabular-nums}
  #sunLvl{font-size:11.5px;color:var(--dim);width:104px;text-align:right;white-space:nowrap;overflow:hidden}
  input[type=range]{width:130px;accent-color:var(--accent)}
  #panel{position:fixed;top:0;right:0;bottom:0;width:352px;max-width:94vw;background:rgba(13,17,27,.96);border-left:1px solid var(--line);backdrop-filter:blur(10px);padding:22px;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:40;overflow-y:auto}
  #panel.open{transform:translateX(0)}
  #panel .close{position:absolute;top:14px;right:14px;background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;width:30px;height:30px;cursor:pointer}
  .tag{display:inline-block;font-size:11px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--dim);margin-bottom:12px}
  #panel h2{font-family:Georgia,serif;font-weight:400;font-size:22px;line-height:1.25;margin-bottom:14px}
  .shade{border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:13px;line-height:1.55;border:1px solid}
  .shade b{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
  .shade.crit{border-color:#8a2a18;background:rgba(255,77,46,.1);color:#ffb3a3}
  .shade.low{border-color:#7a5c1e;background:rgba(245,185,113,.09);color:#f5d9a3}
  .shade.ok{border-color:#1e7a4b;background:rgba(61,220,132,.09);color:#a3f0c6}
  #panel p.desc{font-size:14px;line-height:1.6;opacity:.93}
  .prop{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .prop b{color:var(--green);font-size:12px;letter-spacing:1px;text-transform:uppercase}
  .prop p{font-size:13.5px;line-height:1.6;color:#c9cdd8;margin-top:6px}
  .helpA{display:inline-block;margin-top:14px;background:var(--green);color:#0a2a18;font-weight:700;border-radius:10px;padding:10px 16px;font-size:13px;text-decoration:none;margin-right:8px}
  .copyA{display:inline-block;margin-top:14px;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:10px 12px;font-size:13px;cursor:pointer}
  #loader{position:fixed;inset:0;background:#0a0e1a;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;transition:opacity .7s}
  #loader.done{opacity:0;pointer-events:none}
  #loader .sunAnim{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#ffe9c4,#f5b971 60%,#c77f3a);box-shadow:0 0 40px rgba(245,185,113,.5);animation:breathe 1.8s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
  #loader h2{font-family:Georgia,serif;font-weight:400;font-size:21px;letter-spacing:2px}
  #loader h2 span{color:var(--green)}
  #loaderTxt{font-size:12.5px;color:var(--dim);min-height:17px}
  #ldBarW{width:min(320px,70vw);height:4px;background:#1a2030;border-radius:2px;overflow:hidden}
  #ldBar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .25s}
  #loaderErr{display:none;font-size:12.5px;color:#ffb3a3;max-width:340px;text-align:center;line-height:1.6}
  #hamburger{display:none;background:rgba(15,20,31,.88);border:1px solid var(--line);color:var(--text);border-radius:10px;width:38px;height:38px;font-size:16px;cursor:pointer;pointer-events:auto}
  #impact{position:fixed;left:12px;top:112px;width:232px;max-width:70vw;background:rgba(15,20,31,.93);border:1px solid var(--line);border-radius:14px;padding:14px 16px;backdrop-filter:blur(8px);z-index:30;transform:translateX(-120%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  #impact.open{transform:translateX(0)}
  #impact h3{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--green);margin-bottom:10px}
  #impact .r{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;gap:8px}
  #impact .num{font-family:Georgia,serif;font-size:19px;white-space:nowrap}
  #impact .lb{font-size:10.5px;color:var(--dim);line-height:1.35;text-align:right}
  #impact .note{font-size:9.5px;color:#6b7180;margin-top:10px;line-height:1.5;border-top:1px solid var(--line);padding-top:8px}
  #aboutWrap,#introWrap{position:fixed;inset:0;background:rgba(6,8,14,.8);backdrop-filter:blur(3px);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
  #aboutWrap.open{display:flex} #introWrap{display:flex;z-index:95} #introWrap.hidden{display:none}
  .modal{background:#11161f;border:1px solid var(--line);border-radius:16px;max-width:490px;width:100%;padding:26px;max-height:84vh;overflow-y:auto}
  .modal h2{font-family:Georgia,serif;font-weight:400;font-size:21px;margin-bottom:12px}
  .modal h2 span{color:var(--green)}
  .modal p{font-size:13.5px;line-height:1.65;color:#c9cdd8;margin-bottom:10px}
  .modal .close2{float:right;background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;width:28px;height:28px;cursor:pointer}
  .legendRow{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--dim);margin:7px 0}
  .legendRow .sw{width:11px;height:11px;border-radius:50%;flex:none}
  #introBtn{margin-top:16px;background:var(--green);color:#0a2a18;font-weight:700;border:none;border-radius:10px;padding:12px 22px;font-size:14px;cursor:pointer;width:100%}
  #legend{position:fixed;left:12px;bottom:34px;background:rgba(15,20,31,.88);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--dim);backdrop-filter:blur(6px);z-index:30;line-height:1.9}
  #legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px}
  #disc{position:fixed;left:12px;bottom:2px;font-size:10.5px;color:#7b8092;z-index:30;text-shadow:0 1px 3px rgba(0,0,0,.9)}
  #hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:11.5px;color:var(--dim);background:rgba(15,20,31,.82);border:1px solid var(--line);padding:7px 13px;border-radius:999px;z-index:30;backdrop-filter:blur(6px);white-space:nowrap}
  #navCtl{position:fixed;right:12px;bottom:34px;display:flex;flex-direction:column;gap:6px;z-index:30}
  #navCtl .btn{width:40px;height:40px;padding:0;font-size:17px;display:flex;align-items:center;justify-content:center}
  #compass{position:fixed;right:16px;bottom:224px;z-index:25;width:40px;height:40px;pointer-events:none}
  #scaleBar{position:fixed;left:12px;bottom:17px;z-index:25;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
  #scaleBar .bar{height:3px;background:#fff;box-shadow:0 0 3px rgba(0,0,0,.8)}
  #scaleBar .lbl{font-size:10px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);font-weight:600}
  #timeBig{position:fixed;top:64px;left:50%;transform:translateX(-50%);font-family:Georgia,serif;font-size:46px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.75);z-index:35;opacity:0;transition:opacity .25s;pointer-events:none;font-variant-numeric:tabular-nums}
  #timeBig.show{opacity:1}
  #tourBar{position:fixed;top:118px;left:50%;transform:translateX(-50%);background:rgba(15,20,31,.92);border:1px solid var(--accent);border-radius:999px;padding:8px 16px;font-size:12.5px;color:var(--accent);z-index:35;display:none;align-items:center;gap:10px;backdrop-filter:blur(6px)}
  #tourBar.show{display:flex}
  #tourBar button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:4px 9px;font-size:11.5px;cursor:pointer}
  #pinBar{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:rgba(15,20,31,.94);border:1px solid var(--green);border-radius:999px;padding:9px 16px;font-size:12.5px;color:var(--green);z-index:36;display:none;align-items:center;gap:12px;backdrop-filter:blur(6px)}
  #pinBar.show{display:flex}
  #pinBar button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:4px 10px;font-size:11.5px;cursor:pointer}
  #pinWrap{position:fixed;inset:0;background:rgba(6,8,14,.8);backdrop-filter:blur(3px);z-index:96;display:none;align-items:center;justify-content:center;padding:20px}
  #pinWrap.open{display:flex}
  .pinKind{flex:1;background:#1a2030;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px 10px;font-size:13px;cursor:pointer;line-height:1.4;transition:.15s}
  .pinKind.sel[data-k="needs"]{border-color:var(--hot);background:rgba(255,77,46,.14);color:#ffb3a3}
  .pinKind.sel[data-k="has"]{border-color:var(--green);background:rgba(61,220,132,.14);color:#a3f0c6}
  .pinKind.sel[data-k="plant"]{border-color:var(--accent);background:rgba(245,185,113,.14);color:#f5d9a3}
  #pinComment{width:100%;background:#0f141f;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-size:13px;font-family:inherit;resize:vertical}
  #pinSend{margin-top:12px;width:100%;background:var(--green);color:#0a2a18;font-weight:700;border:none;border-radius:10px;padding:12px;font-size:14px;cursor:pointer}
  #pinSend:disabled{opacity:.45;cursor:not-allowed}
  #toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2030;border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-size:12.5px;z-index:100;opacity:0;transition:.25s;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #wx{display:none;margin-top:7px;align-items:center;gap:7px;background:rgba(15,20,31,.88);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;backdrop-filter:blur(6px);pointer-events:auto;width:max-content}
  #wx.show{display:inline-flex}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
  .flbl{position:absolute;top:0;left:0;will-change:transform;pointer-events:auto;cursor:pointer;text-align:center}
  .flbl .dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff;margin:3px auto 0;box-shadow:0 0 8px rgba(0,0,0,.6);transition:transform .15s}
  .flbl:hover .dot{transform:scale(1.35)}
  .flbl.lm .dot{background:var(--accent)} .flbl.pk .dot{background:var(--green)}
  .flbl.di .dot{width:15px;height:15px;background:#e8dfc8}
  .flbl .txt{font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000;white-space:nowrap}
  .slbl{position:absolute;top:0;left:0;will-change:transform;pointer-events:none;font-size:10px;color:#3a3830;font-weight:700;text-shadow:0 1px 2px rgba(255,255,255,.8),0 0 5px rgba(255,255,255,.55);white-space:nowrap}
  @media (max-width:700px){
    #hdr .t h1{font-size:17px} #hdr .t p{display:none}
    #legend,#hint{display:none} input[type=range]{width:88px} #sunLvl{display:none}
    #panel{top:auto;height:64%;width:100%;max-width:100%;border-left:none;border-top:1px solid var(--line);transform:translateY(105%)}
    #panel.open{transform:translateY(0)}
    #hamburger{display:block}
    .row,#actRow{display:none;width:100%;justify-content:flex-start;background:rgba(15,20,31,.94);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:6px}
    .row.mopen,#actRow.mopen{display:flex}
    #impact{top:auto;bottom:100px;left:8px;width:200px} #navCtl{bottom:150px} #compass{bottom:340px}
  }
</style>
</head>
<body>
<div id="loader">
  <div class="sunAnim"></div>
  <h2>ЗЕЛЕН <span>РУСЕ</span></h2>
  <div id="ldBarW"><div id="ldBar"></div></div>
  <div id="loaderTxt">Зареждане…</div>
  <div id="loaderErr"></div>
</div>
<div id="introWrap"><div class="modal" style="text-align:center">
  <h2>ЗЕЛЕН <span>РУСЕ</span></h2>
  <p id="introP1"></p>
  <div class="legendRow"><span class="sw" style="background:#ff4d2e"></span><span id="introL1"></span></div>
  <div class="legendRow"><span class="sw" style="background:#f5b971"></span><span id="introL2"></span></div>
  <div class="legendRow"><span class="sw" style="background:#3ddc84"></span><span id="introL3"></span></div>
  <p id="introP2"></p><button id="introBtn"></button>
</div></div>
<div id="scene"></div><div id="labels"></div>
<div id="hdr">
  <div class="t"><h1 id="title">ЗЕЛЕН <span>РУСЕ</span></h1><p id="subtitle"></p>
    <div id="wx"><span id="wxIco">☀</span><span id="wxTxt"></span></div></div>
  <div id="ctl">
    <div class="row">
      <button class="btn" id="langBtn">EN</button>
      <button class="btn on" id="stBtn"></button>
      <button class="btn on h" id="heatBtn"></button>
      <button class="btn on g" id="treeBtn"></button>
      <button class="btn" id="moodBtn"></button>
    </div>
    <div id="actRow">
      <button class="btn" id="overviewBtn"></button><button class="btn" id="tourBtn"></button>
      <button class="btn" id="impactBtn"></button><button class="btn" id="aboutBtn"></button>
      <button class="btn g" id="pinBtn"></button>
    </div>
    <button id="hamburger">☰</button>
    <div id="sunWrap"><label id="sunLbl"></label>
      <input type="range" id="sun" min="6" max="21" step="0.25" value="10"><span id="sunVal">10:00</span><span id="sunLvl"></span></div>
  </div>
</div>
<div id="panel">
  <button class="close" id="closeBtn">✕</button>
  <span class="tag" id="pTag"></span><h2 id="pName"></h2>
  <div class="shade" id="pShade"><b id="pShadeLbl"></b><span id="pShadeTxt"></span></div>
  <p class="desc" id="pDesc"></p>
  <div class="prop"><b id="pPropLbl"></b><p id="pPropTxt"></p>
    <a id="helpBtn" class="helpA" href="#">🌱</a><button id="copyBtn" class="copyA">📋</button></div>
</div>
<div id="timeBig">14:00</div>
<div id="tourBar"><span id="tourTxt"></span><button id="tourStop"></button></div>
<div id="impact"><h3 id="impH"></h3>
  <div class="r"><span class="num" id="impTrees">—</span><span class="lb" id="impTreesLbl"></span></div>
  <div class="r"><span class="num" id="impCo2">—</span><span class="lb" id="impCo2Lbl"></span></div>
  <div class="r"><span class="num" id="impCool">—</span><span class="lb" id="impCoolLbl"></span></div>
  <div class="r"><span class="num" id="impKm">—</span><span class="lb" id="impKmLbl"></span></div>
  <div class="note" id="impNote"></div></div>
<div id="aboutWrap"><div class="modal"><button class="close2" id="aboutClose">✕</button>
  <h2 id="aboutTitle"></h2><p id="aboutP1"></p><p id="aboutP2"></p><p id="aboutP3"></p></div></div>
<div id="navCtl">
  <button class="btn on" id="modeRot">⟲</button><button class="btn" id="modePan">✥</button>
  <button class="btn" id="zoomIn">＋</button><button class="btn" id="zoomOut">－</button></div>
<svg id="compass" viewBox="0 0 44 44">
  <circle cx="22" cy="22" r="20" fill="rgba(15,20,31,.72)" stroke="#2a3247" stroke-width="1.5"/>
  <path d="M22 6 L26 22 L22 19 L18 22 Z" fill="#ff4d2e"/>
  <path d="M22 38 L26 22 L22 25 L18 22 Z" fill="#9aa0b0"/>
  <text x="22" y="13" text-anchor="middle" fill="#fff" font-size="8" font-weight="700">N</text></svg>
<div id="scaleBar"><div class="bar" id="scaleBarInner" style="width:60px"></div><div class="lbl">500 м</div></div>
<div id="toast"></div>

<!-- ——— гражданска карта: подаване на точка ——— -->
<div id="pinBar"><span id="pinHint"></span><button id="pinCancel"></button></div>
<div id="pinWrap"><div class="modal">
  <button class="close2" id="pinClose">✕</button>
  <h2 id="pinTitle"></h2>
  <p id="pinWhere" style="font-size:12.5px;color:var(--accent)"></p>
  <div style="display:flex;gap:7px;margin:14px 0;flex-wrap:wrap">
    <button class="pinKind" id="kindNeeds" data-k="needs"></button>
    <button class="pinKind" id="kindHas" data-k="has"></button>
    <button class="pinKind" id="kindPlant" data-k="plant"></button>
  </div>
  <textarea id="pinComment" maxlength="280" rows="3"></textarea>
  <p id="pinPrivacy" style="font-size:11px;color:#6b7180;line-height:1.5"></p>
  <button id="pinSend"></button>
</div></div>
<div id="legend">
  <div><span class="sw" style="background:#ff4d2e"></span><span class="lg" data-k="lgCorr"></span></div>
  <div><span class="sw" style="background:#3ddc84"></span><span class="lg" data-k="lgProp"></span></div>
  <div><span class="sw" style="background:#f5b971;border-radius:50%"></span><span class="lg" data-k="lgLm"></span></div>
  <div><span class="sw" style="background:#5d9fc9"></span><span class="lg" data-k="lgRiver"></span></div>
</div>

<script>

троението на макета.", "introBtn": "Разбрах — покажи картата", "aboutTitle": "За проекта „Зелен Русе“", "aboutP1": "Гражданска инициатива на жител на Русе. Макетът е построен изцяло от реални данни на OpenStreetMap: 7862 сгради с истинските си контури, височини и покриви, 2182 улици, 504 зелени площи, 111 спортни площадки, 220 площада и паркинга, 223 отсечки железен път, 8 фонтана и 445 картирани дървета плюс 176 дървесни реда. Брегът на Дунав е изведен от държавната граница и от очертанията на застроената територия.", "aboutP2": "Моделът използва и 123 архитектурни части (building:part) от OSM — кули, куполи, мансарди — заради които сградите имат обем, а не са прости кутии. Поддържат се шест типа покрив: плосък, четирискатен, двускатен, куполен, пирамидален и мансарден. Когато сграда има собствени части, те заместват контура ѝ (правило Simple 3D Buildings) — иначе двете стени съвпадат и картината трепти. Храмовете, музеите и представителните сгради (30 на брой) са без прозоречна текстура, а Пантеонът е изграден като собствен модел: плътен обем върху стъпаловиден постамент със златен купол. Височините идват от OSM там, където са картирани, а за останалите се изчисляват по типа и площта. Две явни грешки в данните са коригирани поименно: Пантеонът (в OSM 3 m за ротонда от ~20 m) и Операта (5 m). Улиците се чертаят с действителната си широчина, а дърветата с реални размери (~8 m корона), като решетка на заетостта следи нищо да не попада върху сграда или платно. 4705 сгради имат скатни покриви: 1148 са изрично картирани като такива в OSM (заедно с цвят „maroon“ и височина на покрива), а останалите са малки жилищни сгради, при които скатният керемиден покрив е нормата в Русе. Дърветата в парковете са допълнени, защото OSM не картира всяко отделно дърво.", "aboutP3": "Стадионите, пистите и трибуните използват действителните си очертания от OSM (трибуните на стадион „Дунав“ например са картирани със 106 точки), а маркировката на футболните игрища се изчислява от формата на e Danube bank is derived from the national border and the built-up outline.", "aboutP2": "The model also renders 123 architectural parts (building:part) from OSM — towers, domes, mansards — which is what gives buildings real massing rather than plain boxes. Six roof types are supported: flat, hipped, gabled, domed, pyramidal and mansard. Where a building has its own parts, those replace its outline (the Simple 3D Buildings rule) — otherwise the two wall surfaces coincide and the image flickers. Churches, museums and civic buildings (30 of them) carry no window texture, and the Pantheon is a purpose-built model: a solid volume on a stepped plinth with a golden dome. Heights come from OSM where mapped; the rest are estimated from type and footprint. Two clear data errors are corrected by name: the Pantheon (OSM says 3 m for a ~20 m rotunda) and the Opera (5 m). Streets are drawn at their true width and trees at real size (~8 m canopy), with an occupancy grid ensuring nothing is placed on a building or a carriageway. 4,705 buildings have pitched roofs: 1,148 are explicitly tagged as such in OSM (with maroon colour and roof height), the rest are small residential buildings where a pitched tile roof is the norm in Ruse. Park trees are supplemented, as OSM does not map every individual tree.", "aboutP3": "Стадионите, пистите и трибуните използват действителните си очертания от OSM (трибуните на стадион „Дунав“ например са картирани със 106 точки), а маркировката на футболните игрища се изчислява от формата на самото игрище. Фасадите с прозорци, скатните покриви, куполите на Пантеона и „Св. Троица“ и телевизионната кула са по реалните си места. Анализът на сянката и предложенията за засаждане са граждански принос, а не одобрен план — отправна точка за разговор с Община Русе и Дирекция „Паркове и градини“.", "ld1": "Drawing the Danube…", "ld2": "Laying out parks and gardens…", "ld3": "Laying streets, squares and railways…", "ld4": "Raising 7,862 buildings with roofs and facades…", "ld5": "Planting the trees…", "ld6": "Marking the hot corridors…", "ld7": "Ready", "pinBtn": "📍 Add a point", "pinHint": "Click a tree or an empty spot", "pinCancel": "Cancel", "pinTitle": "Correct the map here", "pinNeeds": "🔴 This tree is NOT there<br><small style=\"opacity:.75\">the map is wrong</small>", "pinPlant": "🟡 A tree is NEEDED here<br><small style=\"opacity:.75\">no shade</small>", "pinHas": "🟢 There IS a tree here<br><small style=\"opacity:.75\">the map is missing it</small>", "pinOnTree": "tree selected", "pinEmpty": "empty spot", "pinPlaceholder": "Optional: tell us more (e.g. \"the bus stop bakes all day\")", "pinPrivacy": "We collect no name, email or personal data — only the location and your note. Points are reviewed before appearing on the map.", "pinSend": "Send", "pinThanks": "Thank you! Your point will appear after review.", "pinTooMany": "Too many points too quickly. Please try later.", "pinError": "Something went wrong. Please try again.", "pinOutside": "That point is outside Ruse.", "pinOnBuilding": "That is a building — pick a street or yard.", "pinInWater": "That is the Danube 🙂", "pinOffline": "Point submission is not enabled yet.", "toastCopied": "Email copied"}};

 {id:"lipnik",p:[682,-223],n:{bg:"бул. „Липник“",en:"Lipnik Blvd"},bg:{s:"Критично — основната източна артерия без дървесен ред.",d:"Свързва центъра със Здравец, Изток и Чародейка. Хиляди хора чакат по спирките му всеки ден на пек.",p:"Двустранен дървесен ред по цялото трасе и сянка на всяка спирка — най-дългата единична печалба за града."},en:{s:"Critical — the main eastern artery with no tree row.",d:"Connects the centre to Zdravets, Iztok and Charodeyka. Thousands wait at its stops in full sun daily.",p:"A two-sided tree row along the whole route and shade at every stop."}},
 {id:"botev",p:[-201,1113],n:{bg:"бул. „Христо Ботев“",en:"Hristo Botev Blvd"},bg:{s:"Критично — широк, горещ и прашен коридор.",d:"Основната връзка между центъра и южните квартали, минаваща през Родина към възела Е70/Е85.",p:"Зелена средна ивица плюс странични редове — тук има най-много физическо място за нови дървета в целия град."},en:{s:"Critical — a wide, hot, dusty corridor.",d:"The main link between the centre and the southern districts.",p:"A green median plus side rows — the largest physical space for new trees in the city."}},
 {id:"osvoboditel",p:[-763,334],n:{bg:"бул. „Цар Освободител“",en:"Tsar Osvoboditel Blvd"},bg:{s:"Критично — източният ръб на центъра, силно натоварен.",d:"Голяма градска артерия, която разделя центъра от източните квартали.",p:"Дървесен ред от двете страни — свързва зеленината на Парка на възрожденците с южните квартали."},en:{s:"Critical — the eastern edge of the centre, heavily trafficked.",d:"A major artery separating the centre from the eastern districts.",p:"A tree row on both sides, linking the Revivalists' Park to the southern districts."}},
 {id:"skobelev",p:[-763,22],n:{bg:"бул. „Генерал Скобелев“",en:"General Skobelev Blvd"},bg:{s:"Критично — широк булевард през центъра, с фрагментирана зеленина.",d:"Основната напречна ос на централната част, свързваща запад и изток.",p:"Попълване на прекъснатите редове — на места дърветата са изсечени и не са заменяни от години."},en:{s:"Critical — a wide central boulevard with fragmented greenery.",d:"The main cross-axis of the centre.",p:"Infill the broken rows — in places trees were felled years ago and never replaced."}},

 {id:"aleksandrovska",p:[-1004,22],n:{bg:"ул. „Александровска“",en:"Aleksandrovska St"},bg:{s:"Критично — главната пешеходна ос почти без непрекъсната корона.",d:"Търговското сърце на Русе. В горещите следобеди пешеходците изчезват и магазините губят клиенти — сянката тук е търговска инфраструктура, не украса.",p:"Непрекъсната двойна алея; където подземните комуникации пречат — перголи с увивна растителност като бърза временна сянка."},en:{s:"Critical — the main pedestrian spine with almost no continuous canopy.",d:"Ruse's retail heart. Shade here is commercial infrastructure, not decoration.",p:"A continuous double allee; pergolas with climbers where utilities block planting."}},
 {id:"pridunavski",p:[-1565,-223],n:{bg:"бул. „Придунавски“ · Кеят",en:"Pridunavski Blvd · The Quay"},bg:{s:"Критично — отблясъкът от водата удвоява топлинното натоварване.",d:"Крайбрежният булевард по протежение на Дунав, покрай пристанището и Речна гара.",p:"Ред дървета на всеки 25–30 м плюс сенници при панорамните точки."},en:{s:"Critical — glare off the water doubles the heat load.",d:"The riverside boulevard along the Danube.",p:"A shade row every 25–30 m plus sails at viewpoints."}},

const CS="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+-";
const CIX={}; for(let i=0;i<64;i++) CIX[CS[i]]=i;
function decPts(s){
  const out=[]; let i=0,px=0,py=0,first=true;
  while(i<s.length){
    let v=0,sh=0,c;
    do{ c=CIX[s[i++]]; v|=(c&31)<<sh; sh+=5; }while(c&32);
    const a=(v&1)?-((v+1)>>1):(v>>1);
    let w=0; sh=0;
    do{ c=CIX[s[i++]]; w|=(c&31)<<sh; sh+=5; }while(c&32);
    const b=(w&1)?-((w+1)>>1):(w>>1);
    if(first){ px=a; py=b; first=false; } else { px+=a; py+=b; }
    out.push([px,py]);
  }
  return out;
}

// ══════════ помощни за геометрия ══════════
function ringArea(r){ let a=0; for(let i=0;i<r.length;i++){const j=(i+1)%r.length; a+=r[i][0]*r[j][1]-r[j][0]*r[i][1];} return a/2; }
function polyMesh(rings,color,y,opacity){
  const pos=[],idx=[]; let base=0;
  rings.forEach(function(r){
    if(r.length<3) return;
    const v2=r.map(function(p){ const q=T(p); return new THREE.Vector2(q[0],q[1]); });
    if(ringArea(r)>0) v2.reverse();          // CW => горната страна гледа нагоре
    let faces; try{ faces=THREE.ShapeUtils.triangulateShape(v2,[]); }catch(e){ return; }
    v2.forEach(function(p){ pos.push(p.x,0,p.y); });
    faces.forEach(function(f){ idx.push(base+f[0],base+f[1],base+f[2]); });
    base+=v2.length;
  });
  if(!pos.length) return null;
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:C(color),
    transparent:opacity!==undefined,opacity:opacity===undefined?1:opacity,depthWrite:opacity===undefined}));
  m.position.y=y; m.receiveShadow=true; scene.add(m); return m;
}
function ribbonGeom(pts,w,y){
  const pos=[];
  for(let i=0;i<pts.length-1;i++){
    const a=T(pts[i]),b=T(pts[i+1]);
    const dx=b[0]-a[0],dz=b[1]-a[1],L=Math.hypot(dx,dz); if(L<.001) continue;
    const nx=-dz/L*w/2, nz=dx/L*w/2;
    pos.push(a[0]+nx,y,a[1]+nz, b[0]+nx,y,b[1]+nz, a[0]-nx,y,a[1]-nz);
    pos.push(a[0]-nx,y,a[1]-nz, b[0]+nx,y,b[1]+nz, b[0]-nx,y,b[1]-nz);
  }
  return pos;
}

//  Всяка текстура покрива един "етаж x осев модул" и се повтаря по фасадата.
function facadeTex(cls){
  let c,x;
  try{ c=document.createElement('canvas'); c.width=128; c.height=128; x=c.getContext('2d'); }catch(e){ x=null; }
  if(!x) return null;                     // без canvas: само плътен цвят, без сривове
  const S=128;
  x.fillStyle='#ffffff'; x.fillRect(0,0,S,S);
  function win(px,py,pw,ph,dark){
    // рамка
    x.fillStyle='#efece6'; x.fillRect(px-2,py-2,pw+4,ph+4);
    // стъкло с лек градиент (отгоре по-светло — отражение на небето)
    const g=x.createLinearGradient(px,py,px,py+ph);
    g.addColorStop(0,dark?'#7d8794':'#8e99a6');
    g.addColorStop(0.45,dark?'#4d5661':'#5d6673');
    g.addColorStop(1,dark?'#39414b':'#474f59');
    x.fillStyle=g; x.fillRect(px,py,pw,ph);
    // напречна пречка
    x.fillStyle='#e8e4dc'; x.fillRect(px,py+ph*0.52,pw,Math.max(1,ph*0.05));
    x.fillRect(px+pw*0.48,py,Math.max(1,pw*0.05),ph);
  }
  if(cls===1){                       // панелен блок: правилна решетка + балкон
    win(S*0.14,S*0.20,S*0.30,S*0.46,false);
    win(S*0.56,S*0.20,S*0.30,S*0.46,false);
    x.fillStyle='rgba(0,0,0,0.07)'; x.fillRect(0,S*0.80,S,S*0.07);   // междуетажна линия
    x.fillStyle='rgba(255,255,255,0.5)'; x.fillRect(0,S*0.87,S,S*0.04);
  } else if(cls===3){                // индустриално: дълги ленти
    win(S*0.08,S*0.30,S*0.84,S*0.26,true);
    x.fillStyle='rgba(0,0,0,0.06)'; x.fillRect(0,S*0.86,S,S*0.05);
  } else if(cls===2 || cls===5){     // магазин / обществено: голямо остъкляване
    win(S*0.10,S*0.16,S*0.80,S*0.56,false);
    x.fillStyle='rgba(0,0,0,0.05)'; x.fillRect(0,S*0.82,S,S*0.06);
  } else if(cls===4){                // храм: тесен висок прозорец
    win(S*0.36,S*0.14,S*0.28,S*0.58,true);
  } else {                           // обикновена къща/сграда
    win(S*0.20,S*0.22,S*0.26,S*0.42,false);
    win(S*0.56,S*0.22,S*0.26,S*0.42,false);
    x.fillStyle='rgba(0,0,0,0.05)'; x.fillRect(0,S*0.78,S,S*0.05);
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=4; t.encoding=THREE.sRGBEncoding;
  return t;
}

// ——— вътрешен офсет на контур (за скатни покриви) ———
function ringSignedArea(v2){
  let a=0; for(let i=0;i<v2.length;i++){ const j=(i+1)%v2.length; a+=v2[i].x*v2[j].y-v2[j].x*v2[i].y; }
  return a/2;
}
function insetRing(v2,d){
  const n=v2.length, out=[];
  for(let i=0;i<n;i++){
    const p=v2[i], a=v2[(i-1+n)%n], b=v2[(i+1)%n];
    let e1x=p.x-a.x, e1y=p.y-a.y; const l1=Math.hypot(e1x,e1y)||1; e1x/=l1; e1y/=l1;
    let e2x=b.x-p.x, e2y=b.y-p.y; const l2=Math.hypot(e2x,e2y)||1; e2x/=l2; e2y/=l2;
    let n1x=-e1y, n1y=e1x, n2x=-e2y, n2y=e2x;      // левите нормали
    let bx=n1x+n2x, by=n1y+n2y; const lb=Math.hypot(bx,by);
    if(lb<1e-5){ out.push(new THREE.Vector2(p.x,p.y)); continue; }
    bx/=lb; by/=lb;
    const cosH=Math.max(0.4, bx*n1x+by*n1y);
    out.push(new THREE.Vector2(p.x+bx*d/cosH, p.y+by*d/cosH));
  }
  return out;
}
function pitchedRoof(v2,frac){
  // връща вътрешния контур или null, ако сградата е твърде тясна/сложна
  const A0=Math.abs(ringSignedArea(v2));
  if(A0<1e-4) return null;
  let d=Math.min(Math.sqrt(A0)*(frac||0.30), 4.2*SC*2.15);
  if(d<0.05) return null;
  let r=insetRing(v2,d);
  let A1=Math.abs(ringSignedArea(r));
  if(A1>A0){ r=insetRing(v2,-d); A1=Math.abs(ringSignedArea(r)); }
  if(A1>A0*0.86 || A1<A0*0.04) return null;   // офсетът се е обърнал или е изчезнал
  return r;
}

  (function stadiums(){

    const staRings=D.sta.map(decPts);

    // 1b) пистата като пръстен: навътрешен офсет на овала, върху който ляга тревата
    (function trackRing(){
      const rings=[];
      staRings.forEach(function(r){
        const v=r.map(function(p){ const q=T(p); return new THREE.Vector2(q[0],q[1]); });

      const pos=[],col=[],cA=new THREE.Color(),cB=new THREE.Color();

        const v=ring.map(function(p){ const q=T(p); return new THREE.Vector2(q[0],q[1]); });

          let ax=0,ay=0; r.forEach(function(p){const q=T(p); ax+=q[0]; ay+=q[1];});

          if(dd<best){best=dd;sx=ax;sy=ay;}

          col.push(cA.r,cA.g,cA.b, cA.r,cA.g,cA.b, cB.r,cB.g,cB.b);

      if(p[0]!==0) return;

  (function signatures(){
    const HR=SC, VR=SC*2.15;                       // 1 m хоризонтално / вертикално

    // височината на покрива на най-близката сграда (за да не виси във въздуха)

    // add(geo, material, x, y_m, z, radius_m, height_m)
    function add(geo,mat,x,z,yM,rM,hM){

      add(HEMI,GOLD,p[0],p[1],15.7,8.2,6.2);            // златен купол
      add(CYL,GOLD,p[0],p[1],21.6,1.1,1.9);             // фенер

      add(CYL2,PALE,p[0],p[1],11.5,0.8,14);
      add(SPH,M(0x9fa693),p[0],p[1],19.2,0.75,1.5);

    p=at('troitsa');
    if(p){
      const b0=baseAt(p,35,'troitsa')/VR;
      [[0,0,2.4],[-5.5,0,1.7],[5.5,0,1.7]].forEach(function(d){
        add(HEMI,GREENCU,p[0]+d[0]*HR,p[1]+d[1]*HR,b0,d[2],d[2]*1.15);
        add(CON,GOLD,p[0]+d[0]*HR,p[1]+d[1]*HR,b0+d[2]*1.15,0.3,1.8);

    }
    // Доходно здание — фронтон, купол и статуя
    p=at('dohodno');
    if(p){
      const b0=baseAt(p,35,'dohodno')/VR;
      add(CON4,PALE,p[0],p[1],b0,7,3.2).rotation.y=Math.PI/4;
      add(SPH,M(0x4a7a68,{roughness:.4,metalness:.4}),p[0],p[1],b0+3.6,2.4,2.4);

    p=at('leventa');
    if(p){
      add(CYL2,PALE,p[0],p[1],28,2.6,56);
      add(CYL,M(0xbfb9a8),p[0],p[1],48,5.0,5);
      add(CYL,M(0xd06a4a),p[0],p[1],66,0.5,32);

    p=at('pristа');
    if(p){

        add(BOX,M(0xa89b83),p[0]+Math.cos(a2)*rr,p[1]+Math.sin(a2)*rr,1.5,3,3).rotation.y=-a2;

  await step(1,L[lang].ld7);

}

let stOn=true;
const V=new THREE.Vector3();
// прости правоъгълници в екранни координати -> нито един етикет не се застъпва с друг
let placedRects=[];
function fits(cx,cy,wpx,hpx){
  const x0=cx-wpx/2, x1=cx+wpx/2, y0=cy-hpx, y1=cy+4;
  for(let i=0;i<placedRects.length;i++){
    const r=placedRects[i];
    if(x0<r[2]&&x1>r[0]&&y0<r[3]&&y1>r[1]) return false;
  }
  placedRects.push([x0,y0,x1,y1]);
  return true;
}

let labelFrameCounter = 0;

function updateLabels(){
  // Throttle label position calculations on mobile to every 2nd frame
  labelFrameCounter++;
  if (isMobile && labelFrameCounter % 2 !== 0) return;

  const w = innerWidth, h = innerHeight;
  placedRects.length = 0;

  labels.forEach(function(o){
    if(o.t === 'di' && radius < 230){ o.el.style.display = 'none'; return; }
    V.copy(o.pos).project(camera);
    if(V.z > 1 || Math.abs(V.x) > 1.1 || Math.abs(V.y) > 1.1){ o.el.style.display = 'none'; return; }
    
    const cx = (V.x + 1) / 2 * w, cy = (1 - V.y) / 2 * h;
    const txt = o.el.querySelector('.txt');
    const wpx = Math.max(24, (txt ? txt.textContent.length : 6) * 6.1) + 14;
    
    if(!fits(cx, cy, wpx, 26)){ o.el.style.display = 'none'; return; }
    
    o.el.style.display = 'block';
    // Use translate3d to offload positioning to GPU compositor thread
    o.el.style.transform = `translate3d(${cx}px, ${cy}px, 0) translate(-50%, -100%)`;
  });

  const show = stOn && radius < 430;
  streetLabels.forEach(function(o){
    if(!show){ o.el.style.display = 'none'; return; }
    V.copy(o.pos).project(camera);
    if(V.z > 1 || Math.abs(V.x) > 1.03 || Math.abs(V.y) > 1.03){ o.el.style.display = 'none'; return; }
    
    const cx = (V.x + 1) / 2 * w, cy = (1 - V.y) / 2 * h;
    const wpx = o.n.length * 5.6 + 10;
    
    if(!fits(cx, cy + 7, wpx, 15)){ o.el.style.display = 'none'; return; }
    
    o.el.textContent = o.n;
    o.el.style.display = 'block';
    o.el.style.transform = `translate3d(${cx}px, ${cy}px, 0) translate(-50%, -50%)`;
  });
}
// ══════════ КАМЕРА ══════════
let theta=-0.10, phi=0.90, radius=1150;
const target=new THREE.Vector3(0,0,0);
function updateCam(){
  phi=Math.max(.2,Math.min(1.46,phi)); radius=Math.max(45,Math.min(1900,radius));
  target.x=Math.max(TABLE.x0,Math.min(TABLE.x1,target.x));
  target.z=Math.max(TABLE.z0,Math.min(TABLE.z1,target.z));
  camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),
                      target.y+radius*Math.cos(phi),
                      target.z+radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(target);
  // near расте със зуума: реже по-малко отблизо, по-точна дълбочина отдалеч
  const nearWant=Math.max(1.5,Math.min(40,radius*0.035));
  if(Math.abs(camera.near-nearWant)>0.2){ camera.near=nearWant; camera.updateProjectionMatrix(); }
  document.getElementById('compass').style.transform='rotate('+(-theta*180/Math.PI)+'deg)';
  sunLight.target.position.set(target.x,0,target.z);
  sunLight.target.updateMatrixWorld();
  const ext=Math.max(110,Math.min(620,radius*0.85));
  const sc2=sunLight.shadow.camera;
  if(sc2.right!==ext){ sc2.left=-ext; sc2.right=ext; sc2.top=ext; sc2.bottom=-ext; sc2.updateProjectionMatrix(); }
}
let flyAnim=null;
function flyTo(x,z,r,ph,th){
  if(flyAnim) cancelAnimationFrame(flyAnim);
  const s={x:target.x,z:target.z,r:radius,p:phi,t:theta};
  const eR=r||Math.min(radius,180), eP=(ph!=null?ph:Math.max(.45,Math.min(1.0,phi))), eT=(th!=null?th:theta);
  const t0=performance.now();
  (function stp(now){
    const k=Math.min(1,(now-t0)/900), e=1-Math.pow(1-k,3);
    target.x=s.x+(x-s.x)*e; target.z=s.z+(z-s.z)*e;
    radius=s.r+(eR-s.r)*e; phi=s.p+(eP-s.p)*e; theta=s.t+(eT-s.t)*e;
    updateCam();
    if(k<1) flyAnim=requestAnimationFrame(stp); else flyAnim=null;
  })(t0);
}
const cel = renderer.domElement;
let dragMode = 'pan'; // Правим местенето (pan) режим по подразбиране
const pointers = {}; 
let moved = 0;

// Визуално обновяваме бутоните, за да покажат, че сме в режим "Местене"
document.getElementById('modePan').classList.add('on');
document.getElementById('modeRot').classList.remove('on');

// Функция за местене на камерата
function panCamera(dx, dy) {
  const speed = radius * 0.002;
  const right = new THREE.Vector3(Math.cos(theta), 0, -Math.sin(theta));
  const fwd = new THREE.Vector3(-Math.sin(theta), 0, -Math.cos(theta));
  target.add(right.multiplyScalar(-dx * speed));
  target.add(fwd.multiplyScalar(dy * speed));
}

// 1. Прихващане на докосване/клик
cel.addEventListener('pointerdown', function(e) {
  if(flyAnim){cancelAnimationFrame(flyAnim); flyAnim=null;}
  if(tourActive) stopTour();
  
  cel.setPointerCapture(e.pointerId);
  pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
  moved = 0;
});

// 2. Движение 
cel.addEventListener('pointermove', function(e) {
  if (!pointers[e.pointerId]) return;
  e.preventDefault(); 

  const keys = Object.keys(pointers);
  
  // --- УПРАВЛЕНИЕ С 2 ПРЪСТА (Зуум и Въртене - Мобилни) ---
  if (keys.length === 2) {
    const p1 = pointers[keys[0]], p2 = pointers[keys[1]];
    const prevDist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    const prevAngle = Math.atan2(p1.y - p2.y, p1.x - p2.x);

    pointers[e.pointerId] = { x: e.clientX, y: e.clientY }; 

    const p1New = pointers[keys[0]], p2New = pointers[keys[1]];
    const newDist = Math.hypot(p1New.x - p2New.x, p1New.y - p2New.y);
    const newAngle = Math.atan2(p1New.y - p2New.y, p1New.x - p2New.x);

    // Zoom (Pinch)
    if (prevDist > 0) radius *= (prevDist / newDist); 
    
    // Rotate (Twist)
    let angleDiff = newAngle - prevAngle;
    if (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
    if (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
    theta -= angleDiff; 
    
    moved += 10;
    updateCam();
  } 
  // --- УПРАВЛЕНИЕ С 1 ПРЪСТ / МИШКА ---
  else if (keys.length === 1) {
    const p = pointers[e.pointerId];
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    moved += Math.abs(dx) + Math.abs(dy);
    
    // По подразбиране следваме бутона от интерфейса (Местене или Въртене)
    let isPan = (dragMode === 'pan');
    
    // Специална логика за МИШКА (Компютър)
    if (e.pointerType === 'mouse') {
      // e.buttons === 2 е Десен клик, e.buttons === 4 е Среден клик (скрол)
      if (e.buttons === 2) isPan = false; // Десният клик ВИНАГИ върти
      if (e.buttons === 4) isPan = true;  // Средният клик ВИНАГИ мести
    }
    
    if (isPan) {
      panCamera(dx, dy); // Местене
    } else {
      theta -= dx * 0.005; // Въртене
      phi -= dy * 0.005;
    }
    
    p.x = e.clientX; p.y = e.clientY;
    updateCam();
  }
});

// Блокираме падащото меню при десен клик, за да работи въртенето свободно
cel.addEventListener('contextmenu', function(e) { e.preventDefault(); });
// 3. Отпускане на пръст/мишка
function handlePointerEnd(e) {
  if (!pointers[e.pointerId]) return;
  delete pointers[e.pointerId];
  
  if (Object.keys(pointers).length === 0 && moved < 6) {
    if(pinMode) tryPlacePin(e.clientX, e.clientY);
    else pick(e.clientX, e.clientY);
  }
}

cel.addEventListener('wheel', function(e) {
  e.preventDefault();
  if(e.ctrlKey || e.metaKey) radius *= 1 + e.deltaY * 0.004;
  else panCamera(-e.deltaX * 0.9, -e.deltaY * 0.9);
  updateCam();
}, {passive: false});

// 5. Клавиатура (компютър)
addEventListener('keydown', function(e) {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const st = radius / 16;
  const right = new THREE.Vector3(Math.cos(theta), 0, -Math.sin(theta)).multiplyScalar(st);
  const fwd = new THREE.Vector3(-Math.sin(theta), 0, -Math.cos(theta)).multiplyScalar(st);

  if(e.key === 'ArrowUp') target.add(fwd); 
  else if(e.key === 'ArrowDown') target.sub(fwd);
  else if(e.key === 'ArrowLeft') target.sub(right); 
  else if(e.key === 'ArrowRight') target.add(right);
  else if(e.key === 'q' || e.key === 'Q') theta += 0.08; 
  else if(e.key === 'e' || e.key === 'E') theta -= 0.08;
  else if(e.key === '+' || e.key === '=') radius *= 0.88; 
  else if(e.key === '-') radius *= 1.14;
  else return;
  
  e.preventDefault(); updateCam();
});

const sunEl=document.getElementById('sun'),sunVal=document.getElementById('sunVal'),sunLvl=document.getElementById('sunLvl');
function sunFactor(){ const t=parseFloat(sunEl.value); return Math.max(0,Math.sin((t-6)/15*Math.PI)); }
const SKY_D=C(0x9dbdd4),SKY_W=C(0xd8a878);
const SUN_D=C(0xfff0d2),SUN_W=C(0xff9d52);
const _s=new THREE.Color(),_c=new THREE.Color();
function applySun(){
  const t=parseFloat(sunEl.value),h=Math.floor(t),mm=String(Math.round((t-h)*60)).padStart(2,'0');
  const f=sunFactor(),lbl=f>.8?L[lang].sunHigh:f>.4?L[lang].sunMid:L[lang].sunLow;
  const ts=String(h).padStart(2,'0')+':'+mm;
  sunVal.textContent=ts;
  sunLvl.textContent=lbl;
  document.getElementById('timeBig').textContent=ts;
  const a=(t-6)/15*Math.PI, elev=Math.max(0.10,Math.sin(a)*0.82), R=2400;
  sunLight.position.set(target.x+Math.cos(a)*R, elev*R, target.z+520);
  const MD=MOODS[mood];
  sunLight.intensity=(0.40+f*1.45)*(0.9+MD.e*0.22);
  const m=THREE.MathUtils.clamp((elev-0.12)/0.35,0,1);
  _c.copy(SUN_W).lerp(SUN_D,m); sunLight.color.copy(_c);
  _s.copy(SKY_W).lerp(SKY_D,m); scene.background.copy(_s); scene.fog.color.copy(_s);
  ambient.intensity=(0.18+f*0.10)*MD.a;
  hemi.intensity=(0.38+f*0.20)*MD.h;
  renderer.toneMappingExposure=(1.06+f*0.12)*MD.e;
  heatMats.forEach(function(mt){ mt.opacity=heatOn?(0.14+f*0.5):0; });
}

const API_BASE='';

// обратна проекция: единици на макета -> географски координати
const M_LAT=111300, M_LON=111320*Math.cos(D.o[1]*Math.PI/180);
function toLonLat(x,z){
  return [ D.o[0] + x/(M_LON*SC), D.o[1] - z/(M_LAT*SC) ];
}
function nearestDistrict(x,z){
  let best=null,bd=1e18;
  DI.forEach(function(d){ const p=T(d.p); const dd=(p[0]-x)*(p[0]-x)+(p[1]-z)*(p[1]-z);
    if(dd<bd){bd=dd;best=d;} });
  return best? best.n[lang] : '';
}
function nearestStreet(x,z){
  let best='',bd=1e18;
  streetLabelSrc.forEach(function(s){
    const dd=(s.pos.x-x)*(s.pos.x-x)+(s.pos.z-z)*(s.pos.z-z);
    if(dd<bd){bd=dd;best=s.n;}
  });
  return Math.sqrt(bd)<40? best : '';
}

// ——— поставяне на точка чрез клик върху терена ———
const pinRay=new THREE.Raycaster(), pinNdc=new THREE.Vector2();
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
const hitPt=new THREE.Vector3();
function tryPlacePin(sx,sy){
  pinNdc.set((sx/innerWidth)*2-1,-(sy/innerHeight)*2+1);
  pinRay.setFromCamera(pinNdc,camera);
  if(!pinRay.ray.intersectPlane(groundPlane,hitPt)) return;
  let x=hitPt.x, z=hitPt.z;
  if(x<TABLE.x0||x>TABLE.x1||z<TABLE.z0||z>TABLE.z1){ toast(L[lang].pinOutside); return; }
  if(window.__inWater && window.__inWater(x,z)){ toast(L[lang].pinInWater); return; }

  // Дървото се избира по позицията му НА ЕКРАНА, а не по пресичане със
  // земята: цъкаш короната на ~6 м височина, а лъчът удря земята далеч зад
  // ствола (при нисък ъгъл — до 50 м). Екранното сравнение е независимо от ъгъла.
  const TP=window.__TREEPTS||[];
  const _v=new THREE.Vector3(), CROWN=5.5*SC*2.15;
  let best=-1, bestPx=44*44;                 // 44 пиксела допустимо разстояние
  for(let i=0;i<TP.length;i++){
    _v.set(TP[i][0],CROWN,TP[i][1]).project(camera);
    if(_v.z>1) continue;                     // зад камерата
    const px=(_v.x+1)/2*innerWidth, py=(1-_v.y)/2*innerHeight;
    const dx=px-sx, dy=py-sy, d=dx*dx+dy*dy;
    if(d<bestPx){ bestPx=d; best=i; }
  }
  const onTree = best>=0;
  if(onTree){ x=TP[best][0]; z=TP[best][1]; }

  const ll=toLonLat(x,z);
  pendingPin={lon:ll[0],lat:ll[1],district:nearestDistrict(x,z),street:nearestStreet(x,z),tree:onTree};
  const where=(pendingPin.street? pendingPin.street+' · ':'')+pendingPin.district;
  document.getElementById('pinWhere').textContent=
    where+' — '+(onTree? L[lang].pinOnTree : L[lang].pinEmpty);
  document.getElementById('pinComment').value='';
  // Цъкнато дърво -> вероятно казва, че го няма в действителност (премахни).
  // Празно място -> вероятно иска дърво тук (предложение за засаждане).
  pinKind = onTree ? 'needs' : 'plant';
  // ако е цъкнато дърво, „тук ИМА дърво“ няма смисъл — крием го
  document.getElementById('kindHas').style.display = onTree ? 'none' : '';
  document.getElementById('kindNeeds').style.display = onTree ? '' : 'none';
  document.querySelectorAll('.pinKind').forEach(function(o){o.classList.toggle('sel',o.dataset.k===pinKind);});
  pinWrap.classList.add('open');
  showPinGhost(x,z,onTree);
}

// малък маркер, който показва къде точно ще отиде точката
let pinGhost=null;
function showPinGhost(x,z,onTree){
  if(pinGhost){ scene.remove(pinGhost); pinGhost=null; }
  const col=onTree?0xff5230:0x3ddc84;
  const g=new THREE.Group();
  const ring=new THREE.Mesh(new THREE.TorusGeometry(2.2*SC,0.35*SC,6,20),
    new THREE.MeshBasicMaterial({color:C(col)}));
  ring.rotation.x=-Math.PI/2; ring.position.set(x,0.5,z);
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.22*SC,0.22*SC,9*SC*2.15,5),
    new THREE.MeshBasicMaterial({color:C(col)}));
  stem.position.set(x,4.5*SC*2.15,z);
  g.add(ring,stem); scene.add(g); pinGhost=g;
}
function clearPinGhost(){ if(pinGhost){ scene.remove(pinGhost); pinGhost=null; } }

// ══════════ ЦИКЪЛ ══════════
let tG=0;
function loop(){
  requestAnimationFrame(loop);
  tG+=.016;
  beacons.forEach(function(b,i){
    b.m.position.y=b.y0+Math.sin(tG*2+i)*2.2;
    if(b.spin) b.m.rotation.z+=.015; else b.m.rotation.y+=.02;
  });
  if(heatOn){ const f=sunFactor(),p=0.5+Math.sin(tG*2.2)*0.5;
    heatMats.forEach(function(m){ m.opacity=(0.14+f*0.42)+p*0.14*f; }); }
  const sb=document.getElementById('scaleBarInner');
  const a=new THREE.Vector3(target.x,0,target.z).project(camera);
  const b2=new THREE.Vector3(target.x+500*SC*Math.cos(theta),0,target.z-500*SC*Math.sin(theta)).project(camera);
  sb.style.width=Math.max(8,Math.min(240,Math.abs((b2.x-a.x)/2*innerWidth)))+'px';
  updateLabels();
  renderer.render(scene,camera);
}
// НОВО: "Debounce" функция. Предотвратява забиването на телефона, 
// когато URL лентата се скрива и показва по време на игра с картата.
let resizeTimer = null;
addEventListener('resize',function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  }, 150);
});
applyLang(); updateCam(); loop();
build().then(function(){ loadPins(); });

</script>
</body>
